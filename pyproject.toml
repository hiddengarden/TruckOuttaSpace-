[project]
name = "agency"
version = "0.1.0"
description = "Agent-driven, AI-supervised digital marketing agency built on self-hosted Postiz"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "beautifulsoup4>=4.12",
    "markdownify>=0.13",
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
