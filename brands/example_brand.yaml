# One file per brand. `postiz_group_id` maps to a Postiz "customer/group"
# (GET /public/v1/groups) so channel access stays scoped per brand inside
# a single Postiz instance.
slug: example-brand
name: "Example Co"
postiz_group_id: "REPLACE_WITH_POSTIZ_GROUP_ID"
integration_ids:
  - "REPLACE_WITH_POSTIZ_INTEGRATION_ID"

voice: "Confident and friendly, no corporate jargon, short sentences."
audience: "Small business owners in the US who sell online."

guidelines:
  - "Always include one clear call to action."
  - "Max 2 emojis per post."
  - "No exclamation-point stacking."

banned_topics:
  - "politics"
  - "competitor bashing"
  - "medical, legal, or financial claims"
