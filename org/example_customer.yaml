# One file per customer (client). Nested brands, nested projects.
# Path convention: org/<customer-slug>.yaml
slug: example-customer
name: Example Customer

brands:
  - slug: example-brand
    name: Example Co
    # `postiz_group_id` maps to a Postiz "customer/group" (GET /public/v1/groups)
    # so channel access stays scoped per brand inside a single Postiz instance.
    postiz_group_id: "REPLACE_WITH_POSTIZ_GROUP_ID"
    integration_ids:
      - "REPLACE_WITH_POSTIZ_INTEGRATION_ID"

    voice: "Confident and friendly, no corporate jargon, short sentences."
    audience: "Small business owners in the US who sell online."

    guidelines:
      - "Always include one clear call to action."
      - "Max 2 emojis per post."
      - "No exclamation-point stacking."

    banned_topics:
      - "politics"
      - "competitor bashing"
      - "medical, legal, or financial claims"

    # Re-ingested by `agency run-all` / `agency loop` on every scheduled cycle.
    knowledge_sources:
      - "https://example.com/replace-with-your-about-page"

    # Local folders of markdown, re-ingested the same way -- an Obsidian
    # vault (or any folder of .md files) works directly; .obsidian/.trash/
    # .stversions subfolders are skipped automatically.
    # knowledge_folders:
    #   - "/home/you/Documents/My vault"

    # Default posts proposed/drafted per run when a brand has no projects,
    # or a project below doesn't override it.
    posts_per_run: 1

    # Projects are a sub-brand layer: campaigns, themes, initiatives, series.
    # A brand with no projects just runs against its own voice/guidelines.
    projects:
      - slug: fall-launch
        name: Fall Launch Campaign
        kind: campaign
        topic_hint: "our new fall product line"
        due_date: "2026-10-01"  # checked by Secretary's check_deadlines()
        # extra_guidelines / extra_banned_topics / posts_per_run may all
        # override or add to the brand's own, scoped to this project only.

    # Optional: a website (WordPress) `write-publication --publish-to-wordpress`
    # can post long-form content to, alongside Postiz's social channels.
    # app_password_env names the .env var holding the Application Password --
    # the secret itself never lives in this file.
    # wordpress:
    #   base_url: "https://my-brand.example.com"
    #   username: "agency-bot"
    #   app_password_env: "WORDPRESS_APP_PASSWORD_EXAMPLE_BRAND"
